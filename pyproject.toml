[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-finetune"
version = "0.1.0"
description = "QLoRA fine-tuning of GPT-2 on WikiText-2 with MLflow tracking"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.18.0",
    "evaluate>=0.4.1",
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
    "mlflow>=2.12.0",
    "matplotlib>=3.8.0",
    "accelerate>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pytest>=8.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/llm_finetune"]
